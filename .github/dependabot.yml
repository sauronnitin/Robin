version: 2
updates:
  # Python deps (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Pinned deliberately: newer litellm injects cache_breakpoint into Groq
      # calls, which breaks them. See the override-dependencies comment in
      # pyproject.toml -- do not let Dependabot re-propose this bump.
      - dependency-name: "litellm"

  # Node deps for the resume-parser sidecar
  - package-ecosystem: "npm"
    directory: "/tools/open-resume-parser"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Keep the CodeQL/Actions setup itself current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
