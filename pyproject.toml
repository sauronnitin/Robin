[project]
name = "jobhunter_ai"
version = "0.2.0"
description = "Robin: a local, AI agent-driven job application swarm (bring your own keys + profile)"
authors = [{ name = "Robin contributors" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,google-genai]>=1.15.4,<2.0.0",
    "google-genai>=1.0.0",
    "litellm<=1.82.6",
    "google-api-python-client>=2.160.0",
    "google-auth>=2.38.0",
    "google-auth-oauthlib>=1.2.0",
    "playwright>=1.44.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pdfminer.six>=20231228",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.10",
]

[project.scripts]
robin = "robin.main:run"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
# Pins LiteLLM to last version that does NOT inject cache_breakpoint into Groq calls
override-dependencies = ["litellm<=1.82.6"]
